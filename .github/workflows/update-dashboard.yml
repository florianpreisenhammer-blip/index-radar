name: Dashboard aktualisieren und deployen

# Rechnet die Prognose neu und schiebt das Ergebnis zu Vercel.
# Zweimal taeglich: morgens (faengt Meldungen der Nacht) und am spaeten Abend
# (S&P veroeffentlicht Indexaenderungen in der Regel nach US-Boersenschluss).
on:
  schedule:
    - cron: "0 6 * * 1-6"
    - cron: "30 22 * * 1-5"
  workflow_dispatch:          # Schaltflaeche "Run workflow" auf GitHub

concurrency:
  group: dashboard-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Prognose rechnen und Export bauen
        run: |
          # Yahoo drosselt Rechenzentrums-IPs gelegentlich. Bis zu drei Anlaeufe
          # mit Pause; die Plausibilitaetspruefung im Tool bricht ab, statt
          # eine halbleere Seite zu exportieren (Exit-Code 2).
          for attempt in 1 2 3; do
            echo "::group::Anlauf $attempt"
            if python -m index_radar --export dist; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Anlauf $attempt fehlgeschlagen."
            [ "$attempt" -lt 3 ] && sleep 180
          done
          echo "::error::Alle drei Anlaeufe fehlgeschlagen - es wird nicht deployed."
          exit 1

      - name: Export als Artefakt sichern
        if: always() && hashFiles('dist/data.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-export
          path: dist/
          retention-days: 14

      - name: Zu Vercel deployen
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name fehlt."
              exit 1
            fi
          done
          # Der Export-Schritt hat .vercel/output bereits nach der Build Output API
          # erzeugt - Vercel liefert die Dateien unveraendert aus und baut nichts.
          # VERCEL_ORG_ID und VERCEL_PROJECT_ID uebernehmen die Projektzuordnung.
          if ! npx --yes vercel@63 deploy --prebuilt --prod --yes \
               > vercel-out.txt 2> vercel-err.txt; then
            echo "::error::Vercel-Deploy fehlgeschlagen"
            cat vercel-err.txt
            exit 1
          fi
          cat vercel-err.txt
          # Die CLI schreibt im Terminal JSON, im CI nur Fortschritt auf stderr.
          # Die letzte genannte *.vercel.app-Adresse ist in beiden Faellen die
          # Produktionsadresse (JSON: "Production URL", CI: "Aliased").
          url=$(cat vercel-out.txt vercel-err.txt | tr -d '\r' \
                | grep -oE 'https://[A-Za-z0-9._-]+\.vercel\.app' | tail -1)
          echo "Deployed: ${url:-Adresse nicht aus der Ausgabe lesbar}"
          stand=$(python3 -c "import json; print(json.load(open('dist/data.json'))['generated_at'])")
          {
            echo "### Dashboard aktualisiert"
            [ -n "$url" ] && echo "$url"
            echo "Datenstand: $stand"
          } >> "$GITHUB_STEP_SUMMARY"
